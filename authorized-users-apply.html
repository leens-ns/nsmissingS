<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>남성초등학교 분실물 센터 - 허용 계정 적용</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @font-face {
      font-family: "Paperlogy";
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      src: local("Paperlogy-4Regular"), local("Paperlogy 4 Regular"),
        url("https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-4Regular.woff2") format("woff2");
    }
    @font-face {
      font-family: "Paperlogy";
      font-weight: 600;
      font-style: normal;
      font-display: swap;
      src: local("Paperlogy-6SemiBold"), local("Paperlogy 6 SemiBold"),
        url("https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-6SemiBold.woff2") format("woff2");
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Paperlogy", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #f3f5fb;
      color: #1f2937;
      font-size: 14px;
    }
    .page {
      max-width: 820px;
      margin: 0 auto;
      padding: 18px;
    }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
      padding: 18px;
    }
    header {
      text-align: center;
      margin-bottom: 14px;
    }
    h1 {
      margin: 8px 0 4px;
      color: #2563eb;
      font-size: 1.5rem;
      font-weight: 600;
    }
    p { color: #64748b; line-height: 1.6; }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin: 12px 0;
    }
    .btn {
      min-height: 36px;
      border: 1px solid #dbe3ef;
      border-radius: 8px;
      background: #fff;
      color: #334155;
      padding: 7px 12px;
      font: inherit;
      cursor: pointer;
    }
    .btn-primary {
      border-color: #2563eb;
      background: #2563eb;
      color: #fff;
    }
    .btn-danger {
      border-color: #fecaca;
      background: #fef2f2;
      color: #991b1b;
    }
    .btn:disabled {
      opacity: 0.55;
      cursor: default;
    }
    input[type="file"],
    textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      padding: 8px;
      font: inherit;
    }
    textarea {
      min-height: 160px;
      resize: vertical;
      line-height: 1.5;
    }
    .status {
      min-height: 88px;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #f8fafc;
      color: #334155;
      white-space: pre-wrap;
      line-height: 1.6;
    }
    .ok { color: #0f766e; }
    .bad { color: #b91c1c; }
    .help {
      margin-top: 12px;
      padding-left: 18px;
      color: #475569;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>허용 계정 적용</h1>
      <p>관리자로 로그인한 뒤 교직원 CSV를 선택하면 허용 계정을 Firestore에 등록합니다.</p>
    </header>

    <main class="card">
      <div class="row">
        <button id="loginBtn" class="btn btn-primary" type="button">Google 로그인</button>
        <button id="logoutBtn" class="btn" type="button" style="display:none;">로그아웃</button>
        <a class="btn" href="admin.html">관리자 화면</a>
      </div>

      <div id="authStatus" class="status">로그인 상태를 확인하는 중입니다.</div>

      <div class="row">
        <input id="csvInput" type="file" accept=".csv,text/csv" />
      </div>
      <div class="row">
        <textarea id="csvTextInput" placeholder="파일 선택이 안 될 때 CSV 내용을 그대로 붙여넣습니다."></textarea>
      </div>
      <div class="row">
        <button id="checkBtn" class="btn" type="button">권한 점검</button>
        <button id="applyBtn" class="btn btn-primary" type="button">CSV 계정 적용</button>
      </div>

      <ul class="help">
        <li>CSV 열은 <strong>이메일, 권한, 이름</strong> 순서입니다.</li>
        <li>권한이 비어 있어도 <strong>leens@nsworld.net</strong>은 관리자, 나머지는 교사로 처리합니다.</li>
        <li>권한 점검이 실패하면 Firestore 보안 규칙이 아직 서버에 적용되지 않은 상태입니다.</li>
      </ul>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDyp8MRjZUwZZxBMUZBDpCqYac2TaMIO5M",
      authDomain: "nsmissingt-e9fbf.firebaseapp.com",
      projectId: "nsmissingt-e9fbf",
      storageBucket: "nsmissingt-e9fbf.firebasestorage.app",
      messagingSenderId: "163980342864",
      appId: "1:163980342864:web:e699b4d11af04752cd0355"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const AUTHORIZED_USERS_COLLECTION = "authorized_users";
    const BOOTSTRAP_ADMIN_EMAIL = "leens@nsworld.net";

    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const authStatus = document.getElementById("authStatus");
    const csvInput = document.getElementById("csvInput");
    const csvTextInput = document.getElementById("csvTextInput");
    const checkBtn = document.getElementById("checkBtn");
    const applyBtn = document.getElementById("applyBtn");
    let currentUser = null;

    function normalizeEmail(email) {
      return (email || "").trim().toLowerCase();
    }
    function isSchoolEmail(email) {
      return normalizeEmail(email).endsWith("@nsworld.net");
    }
    function roleFor(email, rawRole) {
      const normalized = normalizeEmail(email);
      const value = String(rawRole || "").trim().toLowerCase();
      if (normalized === BOOTSTRAP_ADMIN_EMAIL || value === "admin" || value === "관리자") return "admin";
      return "teacher";
    }
    function writeStatus(message, className) {
      authStatus.className = "status" + (className ? " " + className : "");
      authStatus.textContent = message;
    }
    function parseCsvLine(line) {
      const cells = [];
      let current = "";
      let quoted = false;
      for (let i = 0; i < line.length; i += 1) {
        const char = line[i];
        const next = line[i + 1];
        if (char === '"' && quoted && next === '"') {
          current += '"';
          i += 1;
        } else if (char === '"') {
          quoted = !quoted;
        } else if (char === "," && !quoted) {
          cells.push(current.trim());
          current = "";
        } else {
          current += char;
        }
      }
      cells.push(current.trim());
      return cells;
    }
    async function readRows() {
      const file = csvInput.files && csvInput.files[0];
      const pasted = csvTextInput ? csvTextInput.value.trim() : "";
      if (!file && !pasted) throw new Error("CSV 파일을 선택하거나 CSV 내용을 붙여넣어 주세요.");
      const text = (file ? await file.text() : pasted).replace(/^\uFEFF/, "");
      const lines = text.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
      let rows = lines.map(parseCsvLine);
      const first = (rows[0] || []).map((cell) => cell.toLowerCase().replace(/\s/g, ""));
      if (first.includes("email") || first.includes("이메일")) rows = rows.slice(1);
      return rows.map((cells) => ({
        email: normalizeEmail(cells[0]),
        role: roleFor(cells[0], cells[1]),
        name: (cells[2] || "").trim()
      })).filter((row) => isSchoolEmail(row.email));
    }
    async function checkPermission() {
      if (!currentUser) throw new Error("먼저 Google 로그인을 해 주세요.");
      if (normalizeEmail(currentUser.email) !== BOOTSTRAP_ADMIN_EMAIL) {
        throw new Error("최초 적용은 leens@nsworld.net 계정으로 로그인해야 합니다.");
      }
      const ref = db.collection(AUTHORIZED_USERS_COLLECTION).doc(BOOTSTRAP_ADMIN_EMAIL);
      await ref.set({
        email: BOOTSTRAP_ADMIN_EMAIL,
        role: "admin",
        active: true,
        name: "담임이노섭",
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
      return true;
    }
    async function applyCsv() {
      applyBtn.disabled = true;
      try {
        await checkPermission();
        const rows = await readRows();
        if (!rows.length) throw new Error("적용할 nsworld.net 계정이 없습니다.");
        const ok = confirm(rows.length + "개 계정을 허용 목록에 적용하시겠습니까?");
        if (!ok) return;
        let done = 0;
        for (const row of rows) {
          await db.collection(AUTHORIZED_USERS_COLLECTION).doc(row.email).set({
            email: row.email,
            role: row.email === BOOTSTRAP_ADMIN_EMAIL ? "admin" : row.role,
            name: row.name,
            active: true,
            updatedBy: normalizeEmail(currentUser.email),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
          done += 1;
          writeStatus(done + "/" + rows.length + "개 계정 적용 중입니다.");
        }
        writeStatus(rows.length + "개 계정을 적용했습니다.", "ok");
      } catch (err) {
        writeStatus(err && err.message ? err.message : "계정 적용 중 오류가 발생했습니다.", "bad");
      } finally {
        applyBtn.disabled = false;
      }
    }

    loginBtn.addEventListener("click", async () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: "select_account" });
      await auth.signInWithPopup(provider);
    });
    logoutBtn.addEventListener("click", () => auth.signOut());
    checkBtn.addEventListener("click", async () => {
      try {
        await checkPermission();
        writeStatus("권한 점검 성공: 허용 계정 등록을 진행할 수 있습니다.", "ok");
      } catch (err) {
        writeStatus(err && err.message ? err.message : "권한 점검 실패", "bad");
      }
    });
    applyBtn.addEventListener("click", applyCsv);

    auth.onAuthStateChanged((user) => {
      currentUser = user;
      if (user) {
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-flex";
        writeStatus(user.email + " 계정으로 로그인했습니다.");
      } else {
        loginBtn.style.display = "inline-flex";
        logoutBtn.style.display = "none";
        writeStatus("로그인하지 않은 상태입니다.");
      }
    });
  </script>
</body>
</html>
